# GreenCharge Application Policy Model (ENACT)
application:
  performance:
    cpu:
      family: "x86_64"
      cores:
        min: 1
        max: 4
    ram:
      capacity: "2Gi"
      timings: "DDR4"        # memory type
  data_storage:
    locations:
      - "eu-west"            # target region
  network:
    capacity:
      bandwidth: "100Mbps"
      latency: "50ms"
      jitter: "10ms"
  energy:
    consumption: "100W"      # max power
    green_energy_mix: 0.6    # >= 60% renewable
